# Weekly cuttings digest — pings the live web app's /admin/run-weekly-digest
# route every Monday at 13:00 UTC (= 8am EST winter / 9am EDT summer). The
# route runs the digest in the same process that owns the Railway volume,
# so it can read the SQLite database without any volume juggling.
#
# Setup (one-time, in this repo's settings):
#   1. Settings → Secrets and variables → Actions → New repository secret
#   2. Add CRON_SECRET (any long random string, e.g. `openssl rand -hex 32`)
#   3. Add the SAME CRON_SECRET as an env var on the Railway web service
#
# Manual trigger: Actions tab → "Weekly cuttings digest" → "Run workflow"
# (uses the same secret; useful for testing without waiting for Monday).

name: Weekly cuttings digest

on:
  schedule:
    # Monday 13:00 UTC. GitHub cron can drift by several minutes — that's
    # fine for a digest. DST note: 13:00 UTC is 8am EST in winter, 9am EDT
    # in summer. Pick a different hour here if you want a flatter year-round
    # local time.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (writes PDFs to /tmp on the server, skips email)'
        required: false
        default: 'false'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest on production
        env:
          CRON_SECRET:    ${{ secrets.CRON_SECRET }}
          DIGEST_URL:     https://www.creativesgarden.com/admin/run-weekly-digest
          DRY_RUN_FLAG:   ${{ github.event.inputs.dryRun == 'true' && '?dryRun=1' || '' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi
          echo "POSTing to $DIGEST_URL$DRY_RUN_FLAG"
          response=$(curl -sS -X POST "$DIGEST_URL$DRY_RUN_FLAG" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            -w "\nHTTP_STATUS:%{http_code}\n")
          echo "$response"
          # Fail the workflow if the server returned a non-2xx status.
          status=$(echo "$response" | tail -1 | sed 's/HTTP_STATUS://')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Digest endpoint returned HTTP $status"
            exit 1
          fi
